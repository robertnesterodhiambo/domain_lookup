<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filter Domains History</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            padding: 25px 30px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-weight: 500;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #007BFF;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:first-child {
            background: #007BFF;
            color: white;
        }

        button:first-child:hover {
            background: #0056b3;
        }

        button:last-child {
            background: #28a745;
            color: white;
        }

        button:last-child:hover {
            background: #1e7e34;
        }

        /* Autocomplete dropdown */
        .autocomplete-list {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            z-index: 9999;
            max-height: 200px;
            overflow-y: auto;
            font-size: 14px;
        }

        .autocomplete-item {
            padding: 8px;
            cursor: pointer;
        }

        .autocomplete-item:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌐 Filter & Prepare Domain History Data</h2>
        <form action="/preview" method="get">
            <label for="start_date">Start Date:</label>
            <input type="date" name="start_date" id="start_date" required>

            <label for="end_date">End Date:</label>
            <input type="date" name="end_date" id="end_date" required>

            <label for="domain_registrar_name">Domain Registrar Name:</label>
            <input type="text" name="domain_registrar_name" id="domain_registrar_name">

            <label for="registrant_name">Registrant Name:</label>
            <input type="text" name="registrant_name" id="registrant_name">

            <label for="registrant_company">Registrant Company:</label>
            <input type="text" name="registrant_company" id="registrant_company">

            <label for="registrant_address">Registrant Address:</label>
            <input type="text" name="registrant_address" id="registrant_address">

            <label for="registrant_city">Registrant City:</label>
            <input type="text" name="registrant_city" id="registrant_city">

            <label for="registrant_state">Registrant State:</label>
            <input type="text" name="registrant_state" id="registrant_state">

            <label for="registrant_zip">Registrant Zip:</label>
            <input type="text" name="registrant_zip" id="registrant_zip">

            <label for="registrant_country">Registrant Country:</label>
            <input type="text" name="registrant_country" id="registrant_country">

            <div class="button-group">
                <button type="submit" name="limit" value="1000">🔍 Preview 1000</button>
                <button type="submit" name="limit" value="all">📥 Download All</button>
            </div>
        </form>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const fields = [
            "domain_registrar_name",
            "registrant_name",
            "registrant_company",
            "registrant_address",
            "registrant_city",
            "registrant_state",
            "registrant_zip",
            "registrant_country"
        ];

        fields.forEach(fieldId => {
            const input = document.getElementById(fieldId);
            const list = document.createElement("div");
            list.classList.add("autocomplete-list");
            list.style.display = "none";
            document.body.appendChild(list);

            input.addEventListener("input", function() {
                const val = this.value;
                if (!val) {
                    list.style.display = "none";
                    return;
                }

                fetch(`/suggest/${fieldId}?q=` + encodeURIComponent(val))
                    .then(res => res.json())
                    .then(data => {
                        list.innerHTML = "";
                        if (data.length === 0) {
                            list.style.display = "none";
                            return;
                        }
                        data.forEach(item => {
                            const div = document.createElement("div");
                            div.classList.add("autocomplete-item");
                            div.textContent = item;
                            div.addEventListener("click", function() {
                                input.value = item;
                                list.style.display = "none";
                            });
                            list.appendChild(div);
                        });
                        const rect = input.getBoundingClientRect();
                        list.style.left = rect.left + "px";
                        list.style.top = (rect.bottom + window.scrollY) + "px";
                        list.style.width = rect.width + "px";
                        list.style.display = "block";
                    });
            });

            document.addEventListener("click", function(e) {
                if (e.target !== input) {
                    list.style.display = "none";
                }
            });
        });
    });
    </script>
</body>
</html>
