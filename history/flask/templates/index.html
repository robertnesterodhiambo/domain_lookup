<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filter Domains History</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #e0e5ec;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: #e0e5ec;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;
            width: 100%;
            max-width: 600px;
            animation: popIn 0.8s ease-out;
        }

        @keyframes popIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 20px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: #e0e5ec;
            box-shadow: inset 5px 5px 10px #babecc, inset -5px -5px 10px #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            box-shadow: inset 2px 2px 5px #babecc, inset -2px -2px 5px #ffffff, 0 0 0 2px #007BFF;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            color: #333;
            background: #e0e5ec;
            box-shadow: 5px 5px 15px #babecc, -5px -5px 15px #ffffff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 5px 5px 10px #babecc, -5px -5px 10px #ffffff, inset 0 0 5px rgba(0,0,0,0.1);
            color: #007BFF;
        }

        button:active {
            transform: scale(0.98);
            box-shadow: inset 5px 5px 10px #babecc, inset -5px -5px 10px #ffffff;
        }

        @media (max-width: 600px) {
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌐 Filter & Prepare Domain History Data</h2>
        <form action="/preview" method="get">
            <label for="start_date">Start Date:</label>
            <input type="date" name="start_date" id="start_date" required>

            <label for="end_date">End Date:</label>
            <input type="date" name="end_date" id="end_date" required>

            <label for="domain_registrar_name">Domain Registrar Name:</label>
            <input type="text" name="domain_registrar_name" id="domain_registrar_name">

            <label for="registrant_name">Registrant Name:</label>
            <input type="text" name="registrant_name" id="registrant_name">

            <label for="registrant_company">Registrant Company:</label>
            <input type="text" name="registrant_company" id="registrant_company">

            <label for="registrant_address">Registrant Address:</label>
            <input type="text" name="registrant_address" id="registrant_address">

            <label for="registrant_city">Registrant City:</label>
            <input type="text" name="registrant_city" id="registrant_city">

            <label for="registrant_state">Registrant State:</label>
            <input type="text" name="registrant_state" id="registrant_state">

            <label for="registrant_zip">Registrant Zip:</label>
            <input type="text" name="registrant_zip" id="registrant_zip">

            <label for="registrant_country">Registrant Country:</label>
            <input type="text" name="registrant_country" id="registrant_country">

            <div class="button-group">
                <button type="submit" name="limit" value="1000">🔍 Preview 1000</button>
                <button type="submit" name="limit" value="all">📥 Download All</button>
            </div>
        </form>
    </div>
</body>
</html>
