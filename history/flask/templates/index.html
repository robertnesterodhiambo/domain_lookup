<!DOCTYPE html>
<html>
<head>
    <title>Filter Domains</title>
</head>
<body>
    <h2>Filter and Prepare Data</h2>
    <form action="/preview" method="get">
        <label>Start Date:</label>
        <input type="date" name="start_date" required><br><br>
        <label>End Date:</label>
        <input type="date" name="end_date" required><br><br>

        <!-- Optional filters -->
        <label>Domain Registrar Name:</label>
        <input type="text" name="domain_registrar_name"><br>

        <label>Registrant Name:</label>
        <input type="text" name="registrant_name"><br>

        <label>Registrant Company:</label>
        <input type="text" name="registrant_company"><br>

        <label>Registrant Address:</label>
        <input type="text" name="registrant_address"><br>

        <label>Registrant City:</label>
        <input type="text" name="registrant_city"><br>

        <label>Registrant State:</label>
        <input type="text" name="registrant_state"><br>

        <label>Registrant Zip:</label>
        <input type="text" name="registrant_zip"><br>

        <label>Registrant Country:</label>
        <input type="text" name="registrant_country"><br><br>

        <button type="submit" name="limit" value="1000">🔍 Preview 1000 Rows</button>
        <button type="submit" name="limit" value="all">🔍 Preview Full Data</button>
    </form>
</body>
</html>
