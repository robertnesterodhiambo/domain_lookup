<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Query Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #fff;
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h3 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }

        header p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        header .actions {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        a {
            text-decoration: none;
            color: #007bff;
            font-size: 14px;
            padding: 8px 14px;
            border: 1px solid #007bff;
            border-radius: 4px;
        }

        a:hover {
            background: #007bff;
            color: white;
        }

        .table-container {
            flex: 1;
            overflow: auto;
            background: white;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table th, table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        table th {
            background: #f1f1f1;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        table tr:nth-child(even) {
            background-color: #fafafa;
        }
    </style>
</head>
<body>

<header>
    <div>
        <h3>✅ Query Completed</h3>
        <p><strong>Rows Found:</strong> {{ count }}</p>
    </div>
    <div class="actions">
        <form action="/download/{{ token }}" method="get">
            <button type="submit">⬇ Download CSV ({{ limit }})</button>
        </form>
        <a href="/">← Go Back</a>
    </div>
</header>

<div class="table-container">
    {{ preview_table|safe }}
</div>

</body>
</html>
