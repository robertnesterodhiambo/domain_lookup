<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Query Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #fff;
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h3 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }

        header p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        header .actions {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        a {
            text-decoration: none;
            color: #007bff;
            font-size: 14px;
            padding: 8px 14px;
            border: 1px solid #007bff;
            border-radius: 4px;
        }

        a:hover {
            background: #007bff;
            color: white;
        }

        .table-container {
            flex: 1;
            overflow: auto;
            background: white;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table th, table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        table th {
            background: #f1f1f1;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        table tr:nth-child(even) {
            background-color: #fafafa;
        }

        .filters th {
            background: #fff !important;
        }

        .filters input {
            width: 100%;
            padding: 4px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            font-size: 13px;
        }
    </style>

    <!-- DataTables CSS & JS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
</head>
<body>

<header>
    <div>
        <h3>✅ Query Completed</h3>
        <p><strong>Rows Found:</strong> {{ count }}</p>
    </div>
    <div class="actions">
        <button id="downloadFiltered">⬇ Download Filtered CSV</button>
        <a href="/">← Go Back</a>
    </div>
</header>

<div class="table-container">
    {{ preview_table|safe }}
</div>

<script>
$(document).ready(function() {
    // Ensure table has an ID for DataTables
    $("table").attr("id", "resultTable");

    // Clone header row for filters
    $('#resultTable thead tr')
        .clone(true)
        .addClass('filters')
        .appendTo('#resultTable thead');

    var table = $('#resultTable').DataTable({
        pageLength: 100,
        lengthChange: false,
        ordering: true,
        searching: true,
        scrollX: true,
        orderCellsTop: true,
        initComplete: function () {
            var api = this.api();

            api.columns().eq(0).each(function (colIdx) {
                var cell = $('.filters th').eq($(api.column(colIdx).header()).index());
                var title = $(cell).text();
                $(cell).html('<input type="text" placeholder="Search '+title+'" />');

                $('input', cell).on('keyup change', function () {
                    api.column(colIdx)
                        .search(this.value)
                        .draw();
                });
            });
        }
    });

    // Download filtered data
    $('#downloadFiltered').on('click', function() {
        var csv = [];
        var headers = [];

        // Get table headers (from first row, not filter row)
        $('#resultTable thead tr:eq(0) th').each(function() {
            headers.push($(this).text().trim());
        });
        csv.push(headers.join(","));

        // Get only filtered rows
        table.rows({ search: 'applied' }).every(function() {
            var row = this.data();
            var cleanRow = row.map(function(cell) {
                return '"' + $('<div>').html(cell).text().replace(/"/g, '""') + '"';
            });
            csv.push(cleanRow.join(","));
        });

        // Create downloadable CSV
        var csvString = csv.join("\n");
        var blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
        var link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "filtered_data.csv";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
});
</script>

</body>
</html>
