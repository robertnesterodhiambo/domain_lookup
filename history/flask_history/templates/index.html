<!DOCTYPE html>
<html>
<head>
    <title>Registrant Info Input</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        .field-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .dropdown {
            position: relative;
        }

        .suggestions {
            position: absolute;
            border: 1px solid #ccc;
            background: white;
            z-index: 1000;
            max-height: 150px;
            overflow-y: auto;
            width: 300px;
            display: none;
        }

        .suggestions div {
            padding: 5px;
            cursor: pointer;
        }

        .suggestions div:hover {
            background-color: #f0f0f0;
        }

        input {
            width: 300px;
            padding: 5px;
        }

        .preview-box {
            font-size: 12px;
            background: #f9f9f9;
            padding: 10px;
            border: 1px dashed #ccc;
            max-height: 140px;
            overflow-y: auto;
            width: 300px;
        }

        .preview-box p {
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <h1>Registrant Info Input</h1>
    <form id="excel-form" autocomplete="off">
        {% for field in fields %}
            <label for="{{ field }}">{{ field.replace('_', ' ').title() }}</label>
            <div class="field-container">
                <div class="dropdown">
                    <input type="text" name="{{ field }}" id="{{ field }}" class="search-input">
                    <div class="suggestions" id="{{ field }}-suggestions"></div>
                </div>
                <div class="preview-box">
                    <strong>Examples:</strong>
                    {% for val in preview_data[field] %}
                        <p>{{ val }}</p>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </form>

    <script>
        $(".search-input").on("input", function () {
            const field = $(this).attr("id");
            const query = $(this).val();
            const suggestionsBox = $(`#${field}-suggestions`);

            if (query.length < 1) {
                suggestionsBox.empty().hide();
                return;
            }

            $.get(`/api/options/${field}?q=${encodeURIComponent(query)}`, function (data) {
                suggestionsBox.empty();

                if (data.length === 0) {
                    suggestionsBox.hide();
                    return;
                }

                data.forEach(function (option) {
                    suggestionsBox.append(`<div class="suggestion-item">${option}</div>`);
                });

                suggestionsBox.show();

                suggestionsBox.find(".suggestion-item").on("click", function () {
                    $(`#${field}`).val($(this).text());
                    suggestionsBox.empty().hide();
                });
            });
        });

        $(document).on("click", function (e) {
            if (!$(e.target).closest(".dropdown").length) {
                $(".suggestions").empty().hide();
            }
        });
    </script>
</body>
</html>
