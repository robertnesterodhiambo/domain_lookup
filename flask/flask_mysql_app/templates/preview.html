<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filtered Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h3 class="mb-4 text-primary">Filter Results</h3>

    <div class="alert alert-light border">
        <strong>Rows Matching Filters:</strong> 
        <span class="fw-bold">{{ filtered_count }}</span>
    </div>

    <form method="POST" action="/download">
        <input type="hidden" name="tld" value="{{ tld }}">
        <input type="hidden" name="registrar_name" value="{{ registrar }}">
        <input type="hidden" name="country" value="{{ country }}">

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Download Excel</button>
            <a href="/" class="btn btn-outline-secondary">Back</a>
        </div>
    </form>

</body>
</html>
