<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filtered Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">🎯 Filter Results Summary</h2>

    <div class="alert alert-warning">
        <strong>🔎 Rows Matching Filters:</strong> <span class="fw-bold text-dark">{{ filtered_count }}</span>
    </div>

    <form method="POST" action="/download">
        <input type="hidden" name="tld" value="{{ tld }}">
        <input type="hidden" name="registrar_name" value="{{ registrar }}">
        <input type="hidden" name="country" value="{{ country }}">

        <div class="d-flex gap-3">
            <button type="submit" class="btn btn-success">
                📥 Download as Excel
            </button>
            <a href="/" class="btn btn-secondary">
                🔙 Back to Filters
            </a>
        </div>
    </form>
</body>
</html>
